<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juan Francisco Jiménez — Desarrollador Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#12141c;
  --bg2:#191c28;
  --text:#edeff5;
  --text-dim:#9aa0b4;
  --accent:#f2a93b;
  --accent-soft:rgba(242,169,59,.14);
  --live:#35d0a0;
  --line:rgba(255,255,255,.09);
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

.mono{ font-family:'IBM Plex Mono',monospace; }

/* ===== TOP BAR ===== */
.topbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 5%;
  background:rgba(18,20,28,.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-family:'IBM Plex Mono',monospace;
  font-size:.95rem;
  font-weight:500;
  letter-spacing:.02em;
}
.logo span{ color:var(--text-dim); }

.lang-toggle{
  display:flex;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
}
.lang-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:.7rem;
  letter-spacing:.05em;
  padding:7px 14px;
  border:none;
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
  transition:.25s;
}
.lang-btn.active{ background:var(--accent-soft); color:var(--accent); }
.lang-btn:hover{ color:var(--text); }

/* ===== HERO ===== */
.hero{
  min-height:100dvh;
  display:flex;
  align-items:center;
  padding:0 5%;
  position:relative;
  background:
    linear-gradient(120deg, rgba(18,20,28,.88), rgba(18,20,28,.55)),
    url("./IMG/FONDO.jpg") center/cover no-repeat;
  overflow:hidden;
}

.hero-glow{
  position:absolute;
  width:420px; height:420px;
  background:radial-gradient(circle, var(--accent), transparent 70%);
  filter:blur(100px);
  opacity:.14;
  top:-100px; right:-100px;
  z-index:0;
}

.content{
  width:100%;
  max-width:620px;
  animation:fadeUp 1s ease forwards;
  opacity:0;
  z-index:1;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  letter-spacing:.1em;
  color:var(--live);
  border:1px solid rgba(53,208,160,.3);
  background:rgba(53,208,160,.08);
  padding:6px 12px;
  border-radius:100px;
  margin-bottom:22px;
}
.eyebrow .dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--live);
  box-shadow:0 0 0 0 rgba(53,208,160,.6);
  animation:pulse 2s infinite;
}

h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:clamp(2rem, 6vw, 3.1rem);
  line-height:1.15;
  letter-spacing:-.01em;
  margin-bottom:14px;
}

.typing-row{
  display:flex;
  align-items:center;
  min-height:1.6em;
  margin-bottom:6px;
}
#typing{
  font-family:'IBM Plex Mono',monospace;
  color:var(--accent);
  font-weight:500;
  font-size:clamp(1rem, 4vw, 1.25rem);
}
.cursor{
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  margin-left:2px;
  animation:blink 1s step-end infinite;
}

p#desc{
  margin:18px 0 32px;
  color:var(--text-dim);
  line-height:1.6;
  font-size:1.02rem;
  font-weight:300;
  max-width:480px;
}

.buttons{ display:flex; gap:14px; flex-wrap:wrap; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:14px 22px;
  border-radius:10px;
  border:1px solid transparent;
  background:var(--accent);
  color:#15161c;
  font-weight:600;
  font-size:.92rem;
  text-decoration:none;
  transition:.25s;
}
.btn i{ font-size:.75rem; transition:.25s; }
.btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(242,169,59,.25); }
.btn:hover i{ transform:translateX(3px); }

.btn.secondary{
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
}
.btn.secondary:hover{ border-color:var(--accent); color:var(--accent); box-shadow:none; }

@keyframes fadeUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
@keyframes blink{ 50%{ opacity:0; } }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(53,208,160,.5); }
  70%{ box-shadow:0 0 0 8px rgba(53,208,160,0); }
  100%{ box-shadow:0 0 0 0 rgba(53,208,160,0); }
}

@media (max-width:768px){
  .hero{ justify-content:center; text-align:center; padding-top:70px; }
  .eyebrow{ margin-left:auto; margin-right:auto; }
  .buttons{ justify-content:center; width:100%; }
  p#desc{ margin-left:auto; margin-right:auto; }
  .hero-glow{ width:260px; height:260px; top:15%; left:50%; transform:translate(-50%,-50%); }
}

@media (max-width:480px){
  .buttons{ flex-direction:column; align-items:stretch; }
  .btn{ justify-content:center; }
}
</style>
</head>
<body>

<header class="topbar">
  <span class="logo">JF<span>/dev</span></span>
  <div class="lang-toggle">
    <button class="lang-btn active" id="langEN" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="langES" onclick="setLang('es')">ES</button>
  </div>
</header>

<section class="hero">
  <div class="hero-glow"></div>
  <div class="content">
    <div class="eyebrow"><span class="dot"></span><span id="status">AVAILABLE FOR WORK</span></div>
    <h1 id="title">Hi, I'm Juan Francisco Jiménez</h1>
    <div class="typing-row"><span id="typing"></span><span class="cursor">▍</span></div>
    <p id="desc">I build systems real companies run their operations on.</p>
    <div class="buttons">
      <a href="aboutme.html" class="btn"><span id="aboutBtn">About me</span> <i class="fas fa-arrow-right"></i></a>
      <a href="project.html" class="btn secondary"><span id="projBtn">Projects</span> <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>
</section>

<script>
let lang="en";
const text={
    en:{
        title:"Hi, I'm Juan Francisco Jiménez",
        status:"AVAILABLE FOR WORK",
        desc:"I build systems real companies run their operations on.",
        about:"About me",
        projects:"Projects",
        typing:["Web Developer","System Builder","Problem Solver"]
    },
    es:{
        title:"Hola, soy Juan Francisco Jiménez",
        status:"DISPONIBLE PARA PROYECTOS",
        desc:"Construyo sistemas que empresas reales usan todos los días.",
        about:"Sobre mí",
        projects:"Proyectos",
        typing:["Desarrollador Web","Creador de Sistemas","Solucionador de Problemas"]
    }
};

function setLang(target){
    if(lang===target) return;
    lang=target;
    document.getElementById("langEN").classList.toggle("active", target==="en");
    document.getElementById("langES").classList.toggle("active", target==="es");
    document.documentElement.lang = target;
    document.getElementById("title").innerText=text[lang].title;
    document.getElementById("status").innerText=text[lang].status;
    document.getElementById("desc").innerText=text[lang].desc;
    document.getElementById("aboutBtn").innerText=text[lang].about;
    document.getElementById("projBtn").innerText=text[lang].projects;
    resetTyping();
}

let i=0,j=0,current="",deleting=false,typingLoop;
function typeEffect(){
    const words=text[lang].typing;
    current=words[i];
    if(!deleting){
        document.getElementById("typing").textContent=current.slice(0,j++);
        if(j>current.length) deleting=true;
    }else{
        document.getElementById("typing").textContent=current.slice(0,j--);
        if(j<0){
            deleting=false;
            i=(i+1)%words.length;
        }
    }
    typingLoop=setTimeout(typeEffect,deleting?60:120);
}

function resetTyping(){
    clearTimeout(typingLoop);
    i=0; j=0; deleting=false;
    typeEffect();
}
typeEffect();
</script>

</body>
</html>
